[project]
name = "fom-mapper"
version = "0.1.0"
description = "Universal FHIR to OMOP CDM Mapping Application (FOM) - Release 0.1 Prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "fhir.resources>=6.8.0",
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "jsonschema>=4.20.0",
    "python-multipart>=0.0.6",
    "aiosqlite>=0.19.0",  # local/dev fallback
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# FastAPI requires Form()/File()/Depends() as default values; B008 is a false
# positive for these framework dependency markers.
ignore = ["B008"]
select = ["E", "F", "UP", "B", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
