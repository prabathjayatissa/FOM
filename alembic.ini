[alembic]
# path to migration scripts
script_location = alembic

# timezone to use when running the date
# revision serialization (used by alembic.command)
# timezone = UTC

# the template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# version location
version_locations = alembic/versions

# the naming style for migrations
# version_code_style = camel

# sqlalchemy.url
sqlalchemy.url = driver://user:pass@localhost/dbname

# version table name
version_table = alembic_version

# the schema to use for the version table
# version_table_schema =

# for 'alembic revision --autogenerate', uncomment and set:
# sqlalchemy.url = postgresql+asyncpg://fom:fom@localhost:5432/fom

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run on newly
# generated revision scripts.  See the documentation for further detail and
# examples

# format using "black" - use the console
# scripts console script
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
