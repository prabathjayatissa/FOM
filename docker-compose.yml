services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fom
      POSTGRES_USER: fom
      POSTGRES_PASSWORD: fom
    ports:
      - "5433:5432"
    volumes:
      - fom_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fom -d fom"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://fom:fom@db:5432/fom
      APP_ENV: dev
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  fom_db_data:
